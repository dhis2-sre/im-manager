# The deployment base: no published ports, nothing built from source, no local stand-ins, so a
# server can use it verbatim. .envrc adds docker-compose.dev.yml through COMPOSE_FILE for local use.
#
# dhis2-infrastructure runs this as one compose project per environment, alongside a second project
# for the web client, both joined to a shared ingress network.
services:
  prod:
    image: dhis2/im-manager:${IMAGE_TAG:-latest}
    env_file:
      - ${ENVIRONMENT_FILE:-.env}
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  database:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DATABASE_USERNAME}", "-d", "${DATABASE_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - database:/var/lib/postgresql/data

  rabbitmq:
    image: bitnamilegacy/rabbitmq:3.13
    environment:
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_MANAGEMENT_ALLOW_WEB_ACCESS: true
      RABBITMQ_DISK_FREE_ABSOLUTE_LIMIT: "100MB"
      RABBITMQ_PLUGINS: "rabbitmq_management,rabbitmq_management_agent,rabbitmq_stream,rabbitmq_stream_management"
    healthcheck:
      test: rabbitmq-diagnostics -q check_running
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: valkey/valkey:8.1.1
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - redis:/data

volumes:
  database:
  redis:
