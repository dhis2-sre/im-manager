# The deployment base: no published ports, nothing built from source, no local stand-ins, so a
# server can use it verbatim. .envrc adds docker-compose.dev.yml through COMPOSE_FILE for local use.
#
# dhis2-infrastructure runs this as one compose project per environment, alongside a second project
# for the web client, both joined to a shared ingress network.
services:
  prod:
    image: dhis2/im-manager:${IMAGE_TAG:-latest}
    env_file:
      - ${ENVIRONMENT_FILE:-.env}
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  database:
    # Matches the deployed environments: a custom format dump taken from those will not restore into
    # an older server.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DATABASE_USERNAME}", "-d", "${DATABASE_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - database:/var/lib/postgresql/data

  rabbitmq:
    # Bitnami's images moved to an unmaintained namespace, and that one also loopback restricted the
    # configured user rather than only guest, which blocked IM on the stream port.
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      # Naming this file replaces the image's default plugin set, so the management plugins are
      # listed alongside the stream one IM needs.
      #
      # Kept out of a root directory named after a chart: helm prefers a local directory of that
      # name over the repository, and skaffold installs rabbitmq, jaeger, valkey and postgresql
      # from repositories.
      - ./compose/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q check_running
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: valkey/valkey:8.1.1
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - redis:/data

volumes:
  database:
  rabbitmq:
  redis:
